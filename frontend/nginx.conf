server {
  listen 8080;
  client_max_body_size 10m;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;

  root /usr/share/nginx/html;
  index index.html;

  # SPA: qualquer rota desconhecida cai no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy pro backend na rede interna do compose. O header Origin é zerado porque
  # navegador e API compartilham esta origem; requisições mutáveis continuam
  # protegidas pelo token CSRF vinculado à sessão HttpOnly.
  # Endpoint experimental aposentado: bloqueado também na borda, antes do proxy.
  location ~* ^/api/teste-antigravity(?:/|$) {
    return 404;
  }

  location /api/ {
    proxy_pass http://backend:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location /uploads/ {
    return 404;
  }

  location /socket.io/ {
    proxy_pass http://backend:4000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
    proxy_read_timeout 75s;
  }
}
