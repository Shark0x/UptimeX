server {
  listen 80;
  client_max_body_size 10m;

  root /usr/share/nginx/html;
  index index.html;

  # SPA: qualquer rota desconhecida cai no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy pro backend na rede interna do compose. O header Origin é zerado de
  # propósito: pro backend a requisição vira "mesma origem" e o CORS não bloqueia
  # (a autenticação é por token no header, então não há risco de CSRF).
  location /api/ {
    proxy_pass http://backend:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Origin "";
  }

  location /uploads/ {
    proxy_pass http://backend:4000/uploads/;
    proxy_set_header Origin "";
  }

  location /socket.io/ {
    proxy_pass http://backend:4000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin "";
  }
}
