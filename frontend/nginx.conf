server {
  listen 8080;
  client_max_body_size 10m;
  server_tokens off;

  # Containers podem receber outro IP depois de restart/recreate. Usar o DNS
  # interno do Docker evita que o nginx mantenha o IP antigo do backend em cache.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  set $backend_upstream http://backend:4000;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;

  root /usr/share/nginx/html;
  index index.html;

  # O HTML e o manifesto apontam para os bundles versionados da release atual.
  # Nao deixa o navegador reutilizar um index antigo depois de um deploy, pois
  # clientes antigos ainda tentavam carregar fotos pela rota publica aposentada.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # Os nomes produzidos pelo Vite possuem hash e podem ser armazenados por longo
  # prazo sem risco de servir codigo de uma release anterior.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # SPA: qualquer rota desconhecida cai no index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy pro backend na rede interna do compose. O header Origin é zerado porque
  # navegador e API compartilham esta origem; requisições mutáveis continuam
  # protegidas pelo token CSRF vinculado à sessão HttpOnly.
  # Endpoint experimental aposentado: bloqueado também na borda, antes do proxy.
  location ~* ^/api/teste-antigravity(?:/|$) {
    return 404;
  }

  location /api/ {
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location /uploads/ {
    return 404;
  }

  location /socket.io/ {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
    proxy_read_timeout 75s;
  }
}
