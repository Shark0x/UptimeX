<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060607" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>uptimeX — Central de Operações</title>
    <!-- Aplica o tema salvo antes da 1ª pintura, evitando "flash" do tema errado. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('uptimex_tema');
          document.documentElement.dataset.theme =
            t === 'claro' || t === 'cinza' || t === 'escuro' ? t : 'escuro';
        } catch (e) {
          document.documentElement.dataset.theme = 'escuro';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
